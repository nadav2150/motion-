<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Videly renderer kitchen sink</title>
<script>
  // Contract: declared synchronously in <head>.
  window.__videly = { duration: 4, fps: 30, width: 1280, height: 720 };
</script>
<link rel="stylesheet" href="/studio-libs/fonts/inter/inter.css">
<script src="/studio-libs/gsap/gsap.min.js"></script>
<script src="/studio-libs/gsap/SplitText.min.js"></script>
<script type="importmap">
  { "imports": { "three": "/studio-libs/three/three.module.min.js", "three/addons/": "/studio-libs/three/addons/" } }
</script>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { background: #11131a; color: #fff; font-family: 'Inter', sans-serif; position: relative; }
  h1 { position: absolute; left: 80px; top: 60px; margin: 0; font-size: 72px; font-weight: 800; letter-spacing: -0.02em; }
  #keyframes { position: absolute; left: 80px; top: 200px; width: 80px; height: 80px; background: #ef8354; animation: spin 2s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #waapi { position: absolute; left: 220px; top: 200px; width: 80px; height: 80px; border-radius: 50%; background: #4f5d75; }
  #late { position: absolute; left: 360px; top: 200px; width: 80px; height: 80px; background: #2d3142; transition: background-color 0.5s linear, transform 0.5s ease-out; }
  #late.on { background: #bfc0c0; transform: scale(1.3); }
  #wave { position: absolute; left: 80px; top: 320px; }
  #three { position: absolute; right: 60px; top: 160px; width: 420px; height: 420px; }
  .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ffd166; }
  #probe { position: absolute; left: 0; top: 640px; width: 40px; height: 40px; background: #ff0000; }
</style>
</head>
<body>
  <h1 id="title">Videly kitchen sink</h1>
  <div id="keyframes"></div>
  <div id="waapi"></div>
  <div id="late"></div>
  <canvas id="wave" width="560" height="200"></canvas>
  <canvas id="three" width="420" height="420"></canvas>
  <div id="particles"></div>
  <div id="probe"></div>

  <script>
    // GSAP: a paused master timeline exposed as __videly.timeline + SplitText.
    gsap.registerPlugin(SplitText);
    var tl = gsap.timeline({ paused: true });
    var split = new SplitText("#title", { type: "chars" });
    tl.from(split.chars, { yPercent: 120, opacity: 0, duration: 0.6, stagger: 0.03, ease: "power3.out" }, 0.1);
    tl.to("#title", { color: "#ef8354", duration: 0.8 }, 2.2);
    window.__videly.timeline = tl;

    // Probe: global-timeline tween, linear, x = 100 + 200 * t (t=1.0 -> x=300).
    gsap.fromTo("#probe", { x: 100 }, { x: 900, duration: 4, ease: "none" });

    // Math.random particles, animated on the global timeline.
    var host = document.getElementById("particles");
    for (var i = 0; i < 40; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.style.left = (80 + Math.random() * 600) + "px";
      p.style.top = (560 + Math.random() * 60) + "px";
      host.appendChild(p);
      gsap.to(p, { y: -40 - Math.random() * 80, opacity: 0.2, duration: 1 + Math.random() * 2, repeat: -1, yoyo: true, ease: "sine.inOut", delay: Math.random() });
    }

    // WAAPI.
    document.getElementById("waapi").animate(
      [{ transform: "translateY(0) scale(1)" }, { transform: "translateY(60px) scale(0.6)" }],
      { duration: 1500, iterations: Infinity, direction: "alternate", easing: "ease-in-out" }
    );

    // setTimeout-triggered class (starts a CSS transition at t=2.0 s).
    setTimeout(function () { document.getElementById("late").classList.add("on"); }, 2000);

    // Canvas 2D rAF loop drawing from absolute time.
    var wave = document.getElementById("wave").getContext("2d");
    function drawWave() {
      var t = performance.now() / 1000;
      wave.clearRect(0, 0, 560, 200);
      wave.strokeStyle = "#8ecae6";
      wave.lineWidth = 4;
      wave.beginPath();
      for (var x = 0; x <= 560; x += 4) {
        var y = 100 + Math.sin(x / 40 + t * 3) * 60 * Math.sin(t * 1.3 + 0.5);
        x === 0 ? wave.moveTo(x, y) : wave.lineTo(x, y);
      }
      wave.stroke();
      wave.fillStyle = "#fff";
      wave.font = "600 20px Inter";
      wave.fillText("t = " + t.toFixed(3) + "s  " + new Date().toISOString(), 8, 190);
      requestAnimationFrame(drawWave);
    }
    requestAnimationFrame(drawWave);
  </script>
  <script type="module">
    import * as THREE from "three";
    const canvas = document.getElementById("three");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(1);
    renderer.setSize(420, 420, false);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.set(0, 0, 6);
    const cube = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0x4f9dff, roughness: 0.35, metalness: 0.2 }));
    scene.add(cube);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.DirectionalLight(0xffffff, 2.2);
    light.position.set(3, 4, 5);
    scene.add(light);
    function frame() {
      const t = performance.now() / 1000;
      cube.rotation.set(t * 0.9, t * 1.3, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
