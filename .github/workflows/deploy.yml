name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The container image is built on the Playwright base image, so the
    # Docker build + push takes longer than a plain Worker deploy.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # wrangler builds ./Dockerfile with the runner's Docker, pushes it to
      # Cloudflare's registry and rolls out the VidelyContainer instances.
      # Runtime secrets (SUPABASE_*, POLAR_*, …) live on the Worker and are
      # set with `wrangler secret put`, not here.
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
